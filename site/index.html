<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tool status</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EEF1F4;
    --panel:#FFFFFF;
    --ink:#1A2230;
    --muted:#5B6472;
    --line:#DADFE5;
    --ok:#157F73;
    --ok-bg:#E4F3F0;
    --degraded:#B8730E;
    --degraded-bg:#FBEEDD;
    --down:#A82F20;
    --down-bg:#FBE7E3;
    --manual:#5B6472;
    --manual-bg:#EBEDF0;
    --indigo:#2F3A56;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"IBM Plex Sans",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:840px;margin:0 auto;padding:40px 24px 80px;}

  .brand{display:flex;align-items:flex-start;gap:16px;margin-bottom:4px;}
  .brand img{height:38px;width:auto;display:block;margin-top:2px;}
  .brand-label{font-size:0.72rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 2px;}

  header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:28px;flex-wrap:wrap;}
  h1{font-size:1.5rem;font-weight:600;margin:0 0 6px;letter-spacing:-0.01em;}
  .sub{color:var(--muted);font-size:0.9rem;margin:0;}
  .updated{font-family:"IBM Plex Mono",monospace;font-size:0.78rem;color:var(--muted);text-align:right;}

  .summary{display:flex;gap:10px;margin-bottom:28px;flex-wrap:wrap;}
  .chip{font-size:0.82rem;padding:6px 12px;border-radius:3px;font-weight:500;display:flex;align-items:center;gap:7px;}
  .chip .dot{width:7px;height:7px;border-radius:50%;display:inline-block;}
  .chip.ok{background:var(--ok-bg);color:var(--ok);}
  .chip.degraded{background:var(--degraded-bg);color:var(--degraded);}
  .chip.down{background:var(--down-bg);color:var(--down);}
  .chip.manual{background:var(--manual-bg);color:var(--manual);}

  .board{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;}
  .row{
    display:grid;
    grid-template-columns:20px 1fr auto;
    gap:16px;
    align-items:start;
    padding:16px 20px;
    border-bottom:1px solid var(--line);
  }
  .row:last-child{border-bottom:none;}
  .row .dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex-shrink:0;}
  .dot.ok{background:var(--ok);}
  .dot.degraded{background:var(--degraded);}
  .dot.down{background:var(--down);}
  .dot.manual{background:var(--manual);}
  .dot.unknown{background:#9AA3AF;}

  .name{font-weight:500;font-size:0.98rem;}
  .detail{color:var(--muted);font-size:0.85rem;margin-top:3px;line-height:1.4;}
  .row a{color:var(--indigo);text-decoration:none;font-size:0.82rem;font-weight:500;}
  .row a:hover{text-decoration:underline;}
  .checked{font-family:"IBM Plex Mono",monospace;font-size:0.72rem;color:#9AA3AF;text-align:right;white-space:nowrap;}

  .section-label{padding:10px 20px;font-size:0.78rem;color:var(--muted);background:#F7F8FA;border-bottom:1px solid var(--line);}

  .empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:0.9rem;}

  footer{margin-top:22px;font-size:0.78rem;color:var(--muted);}
  footer a{color:var(--indigo);}

  button#refresh{
    font-family:"IBM Plex Mono",monospace;
    font-size:0.75rem;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--ink);
    padding:6px 12px;
    border-radius:4px;
    cursor:pointer;
    margin-top:6px;
  }
  button#refresh:hover{background:#F7F8FA;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="brand">
        <img src="logo.png" alt="ICBD logo">
        <div>
          <p class="brand-label">IT Department</p>
          <h1>Tool status</h1>
        </div>
      </div>
      <p class="sub">Official sources for each provider, updated automatically.</p>
    </div>
    <div class="updated">
      <div id="updated-at">Loading…</div>
      <button id="refresh" onclick="load()">Refresh now</button>
    </div>
  </header>

  <div class="summary" id="summary"></div>
  <div class="board" id="board"><div class="empty">Loading status…</div></div>

  <footer>
    Data generated by the automated check (GitHub Actions, every 5 min). Services marked
    <strong>manual review</strong> don't have a public API without authentication; see the note on each row.
  </footer>
</div>

<script>
const STATUS_META = {
  operational: {label: "Operational", cls: "ok"},
  degraded:    {label: "Degraded", cls: "degraded"},
  down:        {label: "Down", cls: "down"},
  manual:      {label: "Manual review", cls: "manual"},
  unknown:     {label: "No data", cls: "unknown"},
};

function order(status){
  return {down:0, degraded:1, unknown:2, manual:3, operational:4}[status] ?? 5;
}

function fmtTime(iso){
  try{
    const d = new Date(iso);
    return d.toLocaleString('en-US', {dateStyle:'short', timeStyle:'short'});
  }catch(e){ return iso; }
}

async function load(){
  try{
    const res = await fetch('status.json?_=' + Date.now());
    if(!res.ok) throw new Error('no data yet');
    const data = await res.json();
    render(data);
  }catch(e){
    document.getElementById('board').innerHTML =
      '<div class="empty">No check has run yet. This will fill in on the workflow\'s first run.</div>';
    document.getElementById('updated-at').textContent = 'No data';
  }
}

function render(data){
  const services = Object.values(data.services || {});
  document.getElementById('updated-at').textContent = 'Last checked: ' + fmtTime(data.generated_at);

  const counts = {};
  services.forEach(s => counts[s.status] = (counts[s.status]||0) + 1);
  const summaryOrder = ['down','degraded','manual','operational'];
  document.getElementById('summary').innerHTML = summaryOrder
    .filter(k => counts[k])
    .map(k => `<span class="chip ${STATUS_META[k].cls}"><span class="dot"></span>${counts[k]} ${STATUS_META[k].label.toLowerCase()}</span>`)
    .join('');

  const sorted = services.slice().sort((a,b) => order(a.status) - order(b.status));

  document.getElementById('board').innerHTML = sorted.map(s => {
    const meta = STATUS_META[s.status] || STATUS_META.unknown;
    return `<div class="row">
      <span class="dot ${meta.cls}"></span>
      <div>
        <div class="name">${s.name}</div>
        <div class="detail">${s.detail || ''}</div>
        <a href="${s.status_url}" target="_blank" rel="noopener">View official source →</a>
      </div>
      <div class="checked">${meta.label}<br>${fmtTime(s.checked_at)}</div>
    </div>`;
  }).join('') || '<div class="empty">No services configured.</div>';
}

load();
setInterval(load, 60000);
</script>
</body>
</html>
